

name: DeployGuard - Quality Gated Deployment

on:
  push:
    branches: [main, feature-deployguard]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: DeployGuard - Validation and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          echo "PASS: Required website files found."

      - name: Check files are not empty
        run: |
          test -s index.html
          test -s style.css
          echo "PASS: Website files are not empty."

      - name: Validate HTML structure
        run: |
          grep -qi "<!doctype html>" index.html
          grep -qi "<html" index.html
          grep -qi "<head>" index.html
          grep -qi "<body>" index.html
          echo "PASS: Basic HTML structure verified."

      - name: Check CSS connection
        run: |
          grep -q 'href="style.css"' index.html
          echo "PASS: CSS stylesheet is connected."

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

 
  deployment_gate:
    name: DeployGuard - Deployment Safety Decision
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Approve deployment
        run: |
          echo "All quality and security checks passed."
          echo "DEPLOYMENT DECISION: APPROVED"
          echo "Production deployment is authorized."

  deploy:
    name: DeployGuard - Production Deployment
    needs: deployment_gate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4


    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
